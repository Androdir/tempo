# Run the Tempo Hub on a Raspberry Pi (or any Docker host).
#
#   1. Create a .env file next to this one:  TEMPO_PAIRING_SECRET=<a long random secret>
#   2. docker compose up -d --build
#   3. Pair your desktop/phone with that secret (see the README).
#
# The DB lives on a named volume, so your history survives container rebuilds.
services:
  tempo-hub:
    build: .
    image: tempo-hub:latest
    container_name: tempo-hub
    ports:
      # Tailscale-first default: expose the container only to this Pi. Tailscale
      # Serve proxies it privately over HTTPS. Set TEMPO_HOST_BIND=0.0.0.0 only
      # when you deliberately want direct LAN access as well.
      - "${TEMPO_HOST_BIND:-127.0.0.1}:7700:7700"
    volumes:
      - tempo-data:/data
    environment:
      # REQUIRED — a strong, random secret used to pair devices + the dashboard.
      TEMPO_PAIRING_SECRET: "${TEMPO_PAIRING_SECRET:?set TEMPO_PAIRING_SECRET in a .env file}"
      TEMPO_PORT: "7700"
      TEMPO_BIND: "0.0.0.0"
      TEMPO_DB: "/data/tempo.db"
      # Optional: allow a separate browser origin. Same-origin Hub dashboards,
      # desktop clients and Android clients need no CORS configuration.
      # TEMPO_ALLOWED_ORIGINS: "http://tempo-pi:7700,http://100.x.y.z:7700"
      #
      # Optional AI for hub-served Daily Review / Lock-In Plan. OpenAI is easiest
      # on a Pi; put the key only in the Pi's local .env file and chmod it 600.
      TEMPO_LLM_ENABLED: "${TEMPO_LLM_ENABLED:-0}"
      TEMPO_LLM_PROVIDER: "${TEMPO_LLM_PROVIDER:-ollama}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      TEMPO_OPENAI_CLASSIFICATION_MODEL: "${TEMPO_OPENAI_CLASSIFICATION_MODEL:-gpt-5.4-nano}"
      TEMPO_OPENAI_REVIEW_MODEL: "${TEMPO_OPENAI_REVIEW_MODEL:-gpt-5.4-mini}"
      # Or use Ollama on another private LAN/Tailscale device:
      # TEMPO_OLLAMA_URL: "http://192.168.1.50:11434"   # your desktop's LAN IP
      # TEMPO_OLLAMA_MODEL: "llama3.1:8b"
    init: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  tempo-data:
