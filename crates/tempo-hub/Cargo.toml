[package]
name = "tempo-hub"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "Tempo Hub — headless central server (REST API + dashboard) for a Raspberry Pi. Receives events from devices into one shared SQLite DB."

[[bin]]
name = "tempo-hub"
path = "src/main.rs"

[dependencies]
tempo-core = { path = "../tempo-core" }
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["clock"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
