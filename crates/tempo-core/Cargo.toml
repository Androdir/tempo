[package]
name = "tempo-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "GUI-free shared logic for Tempo (DB, models, scoring, aggregation, sync events). Used by both the desktop app and the Tempo Hub server."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["clock"] }
# Local-only HTTP client for Ollama (cross-platform, ARM-friendly).
ureq = { version = "2", features = ["json"] }
# Token hashing for device auth on the hub.
sha2 = "0.10"
